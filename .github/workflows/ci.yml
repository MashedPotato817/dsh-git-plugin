name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "docs/**", "chore/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Check that the committed lib/ is current
        run: git diff --exit-code lib

      - name: Type check
        run: npm run check

      - name: Syntax check
        run: node --check lib/index.js

      - name: Unit and integration tests
        run: node --test
