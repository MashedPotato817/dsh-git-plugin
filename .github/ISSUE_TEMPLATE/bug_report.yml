name: 缺陷报告
description: 报告可复现的插件错误、超时或清理问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请提供最小复现，并搜索已有 Issue。日志中请移除 token、账号信息和私人仓库内容。
        支持范围见 [README](https://github.com/MashedPotato817/dsh-git-plugin#支持版本)。
  - type: input
    id: plugin-version
    attributes:
      label: 插件版本或提交 SHA
      placeholder: npm 精确版本，或本地 / GitHub checkout 的 SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 请写实际版本；不确定的项注明未知。
      placeholder: |
        DSH 版本：
        操作系统（含 WSL / 容器）：
        Node / npm / Git 版本：
        入口（CLI / headless / Web / desktop）：
    validations:
      required: true
  - type: dropdown
    id: install-channel
    attributes:
      label: 安装渠道
      options:
        - npm 精确版本
        - GitHub tag / commit
        - 本地 link
        - 本地 tgz
        - 其他
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 写明命令或工具、相关配置，以及会话 cwd 是否为仓库或含子仓库。
      placeholder: |
        1. 在临时 Git 仓库中……
        2. 执行……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: 预期与实际结果
      placeholder: |
        预期：
        实际：
        是否修改了文件 / 分支 / stash：
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志或退出码
      description: 无日志可留空；截图也可附在复现步骤中。
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索已有 Issue 和 PR
          required: true
        - label: 我已移除凭据和私人内容
          required: true
